  }
  .wordmark {
    font-family: 'Lora', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.01em;
    text-decoration: none;
  }
  .header-write-link {
    font-size: 14px;
    text-decoration: none;
    color: var(--muted);
    border-bottom: 1px solid transparent;

  }
  .header-write-link:hover {
    color: var(--ink-navy);
    border-color: currentColor;
  }

  /* ---------- hero ---------- */

    padding: clamp(28px, 8vh, 88px) clamp(20px, 5vw, 64px) clamp(40px, 6vh, 72px);
    max-width: 760px;
  }
  .hero h1 {
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: clamp(34px, 5.2vw, 56px);

    margin: 0 0 20px;
    max-width: 14ch;
  }
  .hero-sub {
    font-size: 16px;
    line-height: 1.6;
    color: var(--muted);
    max-width: 46ch;
    margin: 0 0 32px;
  }
  .cta-write {
    display: inline-block;
    background: #780f5f;
    color: #fff;
    text-decoration: none;
    font-size: 15px;
    padding: 14px 28px;
    border-radius: 7px;
    letter-spacing: 0.01em;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .cta-write:hover {
    background: #c33dbc;
  }
  .cta-write:active {

  .search-form {
    display: flex;

    margin-top: 40px;

    border-bottom: 1px solid var(--hairline);

    flex: 1;
    border: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    color: var(--ink-charcoal);
    padding: 10px 4px;

  .search-form input::placeholder {
    color: var(--faint);

  .search-form input:focus {

    scroll-snap-type: none;

    scroll-snap-align: start;

<main>

<script type="module">

// ---------- Canonical constants (copied exactly) ----------
const CANVAS = { width: 1414, height: 2000 };
const LETTER_AREA = { left: 350, top: 520, width: 730, height: 930 };
const FONT_SIZE_MIN = 24;
const FONT_SIZE_MAX = 48;
const CHAR_LIMIT = 1500;
const LINE_HEIGHT_FACTOR = 1.5;

const FONTS = {
  en: [
    { id: "en-literary-serif", name: "Literary Serif", family: "'Lora', serif" },
    { id: "en-elegant-serif", name: "Elegant Serif", family: "'Cormorant Garamond', serif" },
    { id: "en-editorial-serif", name: "Editorial Serif", family: "'Playfair Display', serif" },
    { id: "en-clean-sans", name: "Clean Sans", family: "'Inter', sans-serif" },
    { id: "en-typewriter", name: "Typewriter", family: "'Courier Prime', monospace" },
    { id: "en-handwritten", name: "Handwritten", family: "'Caveat', cursive" }
  ],
  bn: [
    { id: "bn-serif", name: "Noto Serif Bengali", family: "'Noto Serif Bengali', serif" },
    { id: "bn-sans", name: "Hind Siliguri", family: "'Hind Siliguri', sans-serif" },
    { id: "bn-classic", name: "Tiro Bangla", family: "'Tiro Bangla', serif" },
    { id: "bn-rounded", name: "Baloo Da 2", family: "'Baloo Da 2', sans-serif" },

    { id: "bn-handwritten", name: "Atma", family: "'Atma', cursive" }
  ]
};

const INK_PRESETS = [
  { id: "black", name: "Black Ink", hex: "#1A1A1A" },
  { id: "dark-brown", name: "Dark Brown", hex: "#4A2E1D" },
  { id: "navy", name: "Navy Ink", hex: "#1B2A4A" },
  { id: "deep-red", name: "Deep Red", hex: "#5C1A1A" },
  { id: "forest-green", name: "Forest Green", hex: "#1F3D2B" },
  { id: "charcoal", name: "Charcoal", hex: "#2E2E2E" }
];

// ---------- Canonical Letter Renderer (copied verbatim) ----------
function extractDriveFileId(link) {
  const patterns = [/\/file\/d\/([a-zA-Z0-9_-]{10,})/, /[?&]id=([a-zA-Z0-9_-]{10,})/];
  for (const p of patterns) {
    const m = link.match(p);
    if (m) return m[1];
  }
  return null;
}
function driveDirectUrl(fileId, size = 2000) {
  return `https://drive.google.com/thumbnail?id=${fileId}&sz=w${size}`;
}

function normalizeTo(to) { return to.trim().toLowerCase(); }

function buildToKeywords(to) {
  const norm = normalizeTo(to);
  const keywords = [];
  for (let i = 1; i <= Math.min(norm.length, 40); i++) keywords.push(norm.slice(0, i));
  return keywords;
}

function getFontFamily(fontId) {
  const all = [...FONTS.en, ...FONTS.bn];
  const found = all.find(f => f.id === fontId);
  return found ? found.family : FONTS.en[0].family;
}

function buildLetterText(letter) {
  const lines = [`${letter.salutation} ${letter.to},`, "", letter.body, ""];
  if (letter.from && letter.from.trim().length > 0) lines.push(`— ${letter.from.trim()}`);
  return lines;
}

function wrapParagraph(ctx, text, maxWidth) {
  const words = text.split(" ");
  const lines = [];
  let current = "";
  for (const word of words) {
    const test = current ? current + " " + word : word;
    if (ctx.measureText(test).width > maxWidth && current) { lines.push(current); current = word; }
    else current = test;
  }
  if (current) lines.push(current);
  return lines;
}

function buildWrappedLines(ctx, letter, fontSize) {
  ctx.font = `${fontSize}px ${getFontFamily(letter.fontId)}`;
  const wrapped = [];
  buildLetterText(letter).forEach(line => {
    if (line === "") { wrapped.push(""); return; }
    wrapParagraph(ctx, line, LETTER_AREA.width).forEach(l => wrapped.push(l));
  });
  return wrapped;
}

function checkOverflow(ctx, letter) {
  const wrapped = buildWrappedLines(ctx, letter, letter.fontSize);
  const lineHeight = letter.fontSize * LINE_HEIGHT_FACTOR;
  const totalHeight = wrapped.length * lineHeight;
  return { fits: totalHeight <= LETTER_AREA.height, usedHeight: totalHeight, lines: wrapped, lineHeight };
}

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return { r: parseInt(h.substring(0,2),16), g: parseInt(h.substring(2,4),16), b: parseInt(h.substring(4,6),16) };
}
function isLowContrast(inkHex, backgroundTone) {
  const rgb = hexToRgb(inkHex);
  const luminance = (0.299*rgb.r + 0.587*rgb.g + 0.114*rgb.b) / 255;
  return backgroundTone === "light" ? luminance > 0.55 : luminance < 0.45;
}

function renderLetterDOM(container, letter, scale = 1) {
  container.style.position = "relative";
  container.style.width = `${CANVAS.width * scale}px`;
  container.style.height = `${CANVAS.height * scale}px`;
  container.style.backgroundImage = `url(${letter.themeImageUrl})`;
  container.style.backgroundSize = "cover";
  container.innerHTML = "";
  const textBox = document.createElement("div");
  Object.assign(textBox.style, {
    position: "absolute",
    left: `${LETTER_AREA.left * scale}px`,
    top: `${LETTER_AREA.top * scale}px`,
    width: `${LETTER_AREA.width * scale}px`,
    height: `${LETTER_AREA.height * scale}px`,
    fontFamily: getFontFamily(letter.fontId),
    fontSize: `${letter.fontSize * scale}px`,
    lineHeight: LINE_HEIGHT_FACTOR,
    color: letter.inkColor,
    textAlign: letter.alignment,
    whiteSpace: "pre-wrap",
    overflow: "hidden"
  });
  textBox.textContent = buildLetterText(letter).join("\n");
  container.appendChild(textBox);
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function renderLetterCanvas(letter, branding) {
  const canvas = document.createElement("canvas");
  canvas.width = CANVAS.width;
  canvas.height = CANVAS.height;
  const ctx = canvas.getContext("2d");
  const bgImg = await loadImage(letter.themeImageUrl);
  ctx.drawImage(bgImg, 0, 0, CANVAS.width, CANVAS.height);
  ctx.fillStyle = letter.inkColor;
  ctx.textBaseline = "top";
  const lineHeight = letter.fontSize * LINE_HEIGHT_FACTOR;
  const lines = buildWrappedLines(ctx, letter, letter.fontSize);
  let y = LETTER_AREA.top;
  lines.forEach(line => {
    let x = LETTER_AREA.left;
    if (letter.alignment === "center") { ctx.textAlign = "center"; x = LETTER_AREA.left + LETTER_AREA.width / 2; }
    else if (letter.alignment === "right") { ctx.textAlign = "right"; x = LETTER_AREA.left + LETTER_AREA.width; }
    else ctx.textAlign = "left";
    ctx.fillText(line, x, y);
    y += lineHeight;
  });
  if (branding && branding.watermarkEnabled && branding.logoUrl) {
    const logoImg = await loadImage(branding.logoUrl);
    const w = branding.watermarkSize || 220;
    const h = w * (logoImg.height / logoImg.width);
    let lx = (CANVAS.width - w) / 2;
    if (branding.watermarkPosition === "bottom-left") lx = 60;
    if (branding.watermarkPosition === "bottom-right") lx = CANVAS.width - w - 60;
    const ly = CANVAS.height - h - 60;
    ctx.globalAlpha = branding.watermarkOpacity ?? 0.8;
    ctx.drawImage(logoImg, lx, ly, w, h);
    ctx.globalAlpha = 1;
    if (branding.websiteUrl) {
      ctx.font = "28px 'Inter', sans-serif";
      ctx.fillStyle = "#00000099";
      ctx.textAlign = "center";
      ctx.fillText(branding.websiteUrl, CANVAS.width / 2, ly + h + 10);
    }
  }
  return canvas;
}
// Wrap canvas.toBlob()/toDataURL() calls in try/catch: if the theme or logo image
// lacks CORS headers, this throws a SecurityError ("tainted canvas"). Catch it and
// show: "This letter's PNG couldn't be generated. Please try again later." — do not crash the page.
// (index.html only ever uses renderLetterDOM, never the canvas export path, so this
// risk does not surface here — kept for parity with the canonical block.)

// ---------- Page-specific fallback for missing theme images ----------
// If a letter's theme doc is missing/inactive we still need *some* themeImageUrl —
// renderLetterDOM is used unmodified, so the fallback is applied before calling it.
const FALLBACK_THEME_IMAGE = "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="${CANVAS.width}" height="${CANVAS.height}"><rect width="100%" height="100%" fill="#EFEAE0"/></svg>`
);

// ---------- Relative time ----------
function timeAgo(date) {
  const seconds = Math.floor((Date.now() - date.getTime()) / 1000);
  const units = [
    ["year", 31536000], ["month", 2592000], ["week", 604800],
    ["day", 86400], ["hour", 3600], ["minute", 60]
  ];
  for (const [name, secs] of units) {
    const val = Math.floor(seconds / secs);
    if (val >= 1) return `${val} ${name}${val > 1 ? "s" : ""} ago`;
  }
  return "just now";
}

// ---------- DOM refs ----------
const shelfEl = document.getElementById("shelf");
const shelfStatusEl = document.getElementById("shelfStatus");
const shelfPrevBtn = document.getElementById("shelfPrev");
const shelfNextBtn = document.getElementById("shelfNext");
const searchForm = document.getElementById("searchForm");
const searchInput = document.getElementById("searchInput");

document.getElementById('dearu-footer-year').textContent = new Date().getFullYear();

const PAGE_SIZE = 10;
let themesMap = {};
let lastDoc = null;
let hasMore = true;
let isLoadingPage = false;

// Observer: lazily renders a letter's DOM only once its card nears the viewport.
const renderObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    const wrap = entry.target;
    renderObserver.unobserve(wrap);
    const letter = wrap.__letter;
    if (!letter || wrap.__rendered) return;
    wrap.__rendered = true;
    const scale = wrap.clientWidth / CANVAS.width;
    renderLetterDOM(wrap, letter, scale);
  });
}, { root: shelfEl, rootMargin: "300px", threshold: 0.01 });

// Sentinel: triggers the next page load once the user scrolls near the end.
let sentinelEl = null;
const paginationObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) loadNextPage();
  });
}, { root: shelfEl, rootMargin: "0px 600px 0px 0px", threshold: 0.01 });

function ensureSentinel() {
  if (sentinelEl) sentinelEl.remove();
  sentinelEl = document.createElement("div");
  sentinelEl.className = "shelf-sentinel";
  shelfEl.appendChild(sentinelEl);
  paginationObserver.observe(sentinelEl);
}

function setStatus(text) {
  if (!text) { shelfStatusEl.hidden = true; return; }
  shelfStatusEl.textContent = text;
  shelfStatusEl.hidden = false;
}

function buildCard(letterDoc) {
  const data = letterDoc.data();
  const letter = {
    id: letterDoc.id,
    to: data.to,
    from: data.from,
    body: data.body,
    salutation: data.salutation,
    fontId: data.fontId,
    fontSize: data.fontSize,
    inkColor: data.inkColor,
    alignment: data.alignment,
    createdAt: data.createdAt ? data.createdAt.toDate() : new Date(),
    themeImageUrl: (themesMap[data.themeId] && themesMap[data.themeId].imageUrl) || FALLBACK_THEME_IMAGE
  };

  const card = document.createElement("div");
  card.className = "letter-card";
  card.dataset.id = letter.id;

  const renderWrap = document.createElement("div");
  renderWrap.className = "letter-render-wrap";
  renderWrap.__letter = letter;

  const meta = document.createElement("div");
  meta.className = "letter-meta";
  meta.innerHTML = `
    <p class="letter-to">To: ${escapeHtml(letter.to)}</p>
    <p class="letter-time">released ${timeAgo(letter.createdAt)}</p>
    <a class="letter-open" href="letter.html?id=${encodeURIComponent(letter.id)}">Open</a>
  `;

  card.appendChild(renderWrap);
  card.appendChild(meta);

  renderObserver.observe(renderWrap);
  return card;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

async function loadThemes() {
  try {
    const themesQuery = query(collection(db, "themes"), where("active", "==", true));
    const snap = await getDocs(themesQuery);
    snap.forEach(d => { themesMap[d.id] = d.data(); });
  } catch (err) {
    console.error("Failed to load themes", err);
  }
}

async function loadNextPage() {
  if (isLoadingPage || !hasMore) return;
  isLoadingPage = true;
  setStatus("Loading more letters…");

  try {
    let lettersQuery;
    if (lastDoc) {
      lettersQuery = query(
        collection(db, "letters"),
        where("status", "==", "public"),
        orderBy("createdAt", "desc"),
        startAfter(lastDoc),
        limit(PAGE_SIZE)
      );
    } else {
      lettersQuery = query(
        collection(db, "letters"),
        where("status", "==", "public"),
        orderBy("createdAt", "desc"),
        limit(PAGE_SIZE)
      );
    }

    const snap = await getDocs(lettersQuery);

    if (snap.empty) {
      hasMore = false;
      setStatus(lastDoc ? "" : "No letters yet. Be the first to write one.");
      return;
    }

    if (sentinelEl) sentinelEl.remove();

    snap.forEach(letterDoc => {
      shelfEl.appendChild(buildCard(letterDoc));
    });

    lastDoc = snap.docs[snap.docs.length - 1];
    hasMore = snap.size === PAGE_SIZE;

    ensureSentinel();
    setStatus("");
  } catch (err) {
    console.error("Failed to load letters", err);
    setStatus("Letters couldn't load right now. Try refreshing.");
  } finally {
    isLoadingPage = false;
  }
}

// ---------- shelf interaction: wheel, drag, arrows ----------
shelfEl.addEventListener("wheel", (e) => {
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  e.preventDefault();
  shelfEl.scrollLeft += e.deltaY;
}, { passive: false });

let isDragging = false;
let dragStartX = 0;
let dragStartScroll = 0;
let dragMoved = false;

shelfEl.addEventListener("pointerdown", (e) => {
  isDragging = true;
  dragMoved = false;
  dragStartX = e.clientX;
  dragStartScroll = shelfEl.scrollLeft;
  shelfEl.classList.add("dragging");
  shelfEl.setPointerCapture(e.pointerId);
});
shelfEl.addEventListener("pointermove", (e) => {
  if (!isDragging) return;
  const delta = e.clientX - dragStartX;
  if (Math.abs(delta) > 4) dragMoved = true;
  shelfEl.scrollLeft = dragStartScroll - delta;
});
function endDrag(e) {
  isDragging = false;
  shelfEl.classList.remove("dragging");
}
shelfEl.addEventListener("pointerup", endDrag);
shelfEl.addEventListener("pointercancel", endDrag);
shelfEl.addEventListener("pointerleave", endDrag);
// Prevent a drag from also firing the "Open" link click.
shelfEl.addEventListener("click", (e) => {
  if (dragMoved) { e.preventDefault(); e.stopPropagation(); }
}, true);

const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function scrollByCards(direction) {
  const card = shelfEl.querySelector(".letter-card");
  const step = card ? card.getBoundingClientRect().width + 6 : 300;
  shelfEl.scrollBy({ left: direction * step * 2, behavior: prefersReducedMotion ? "auto" : "smooth" });
}
shelfPrevBtn.addEventListener("click", () => scrollByCards(-1));
shelfNextBtn.addEventListener("click", () => scrollByCards(1));

// ---------- search ----------
searchForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const val = searchInput.value.trim();
  if (!val) { searchInput.focus(); return; }
  window.location.href = `search.html?q=${encodeURIComponent(val)}`;
});

// ---------- boot ----------
(async function init() {
  await loadThemes();
  await loadNextPage();
})();
</script>
</body>
